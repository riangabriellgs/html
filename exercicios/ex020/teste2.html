<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test 2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p {
            display: none;
        }
        div:hover > p{
            background-color: red;
            color: white;
            display: block;
        }
        div:hover{
            color: red;
        }
    </style>
</head>
<body>
     <h1>Exemplo de hover</h1>
     <p>passe o mouse sobre texto</p>
     <div>
        passe o mouse aqui
        <p>TEXTO ESCONDIDO......</p>
     </div>
</body>
</html>
